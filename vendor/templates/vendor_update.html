{% extends "base_vendor.html" %}

{% block title %} Vendor | Edit {% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-header-title">Edit Store Detail</h2>
    
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        {# Spans full width; internal form element loops map directly to grid layout positions #}
        {{ form.as_p }}
        
        <div class="form-actions-group">
            <button type="submit" class="btn-primary-submit">Edit Store</button>
            <a href="{% url 'vendor:detail' %}" class="btn-link-cancel">Cancel Update</a>
        </div>
    </form>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    // Find all Django form field paragraphs containing file uploads
    document.querySelectorAll('.form-container form > p').forEach(paragraph => {
        const fileInput = paragraph.querySelector('input[type="file"]');
        if (!fileInput) return; // Skip if it's a standard text field

        const fileLink = paragraph.querySelector('a');
        const deleteCheckbox = paragraph.querySelector('input[type="checkbox"]');

        // Verify if a file is already uploaded to this field
        if (fileLink) {
            // 1. Create a clean container for the file details
            const metaContainer = document.createElement('div');
            metaContainer.className = 'file-current-meta';

            // 2. Format and style the file anchor link
            fileLink.className = 'file-link-badge';
            fileLink.innerHTML = `📄 ${fileLink.textContent}`;

            // 3. Move the file link into our new container
            metaContainer.appendChild(fileLink);

            // 4. If a delete option exists, restyle the checkbox layout
            if (deleteCheckbox) {
                const deleteLabel = document.createElement('label');
                deleteLabel.className = 'file-delete-action';
                
                const deleteText = document.createElement('span');
                deleteText.textContent = 'Remove';
                
                // Append nodes cleanly to maintain active Django bindings
                deleteLabel.appendChild(deleteText);
                deleteLabel.appendChild(deleteCheckbox);
                metaContainer.appendChild(deleteLabel);
            }

            // 5. Clear out the raw text nodes generated by Django
            // This clears text like "Currently:", "Change:", and "Clear" safely
            Array.from(paragraph.childNodes).forEach(node => {
                if (node !== fileInput && node !== paragraph.firstElementChild) {
                    node.remove();
                }
            });

            // 6. Insert our updated layout components into the form row
            paragraph.insertBefore(metaContainer, fileInput);
        } else {
            // Clean up text fragments for fields that don't have an uploaded file yet
            Array.from(paragraph.childNodes).forEach(node => {
                if (node !== fileInput && node !== paragraph.firstElementChild && node !== paragraph.querySelector('.helptext')) {
                    if (node.nodeType === Node.TEXT_NODE) node.remove();
                }
            });
        }
    });
});
</script>
{% endblock %}
