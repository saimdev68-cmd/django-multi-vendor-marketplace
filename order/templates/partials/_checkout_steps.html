<div class="w-full max-w-xl mx-auto mb-12">
    <div class="relative flex items-center justify-between">
        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-0.5 bg-slate-100 -z-10"></div>
        <div class="absolute left-0 top-1/2 -translate-y-1/2 h-0.5 bg-gradient-to-r from-slate-700 to-slate-900 transition-all duration-500 -z-10" 
             style="width: {% if active_step == 1 %}0%{% elif active_step == 2 %}50%{% else %}100%{% endif %};">
        </div>

        <div class="flex flex-col items-center">
            <div class="w-10 h-10 rounded-full flex items-center justify-center border-2 font-semibold text-sm transition-all duration-300 
                {% if active_step >= 1 %}
                    border-slate-800 bg-white text-slate-900 shadow-sm ring-4 ring-slate-900/5
                {% else %}
                    border-slate-200 bg-white text-slate-400
                {% endif %}">
                {% if active_step > 1 %}
                    <i class="fa-solid fa-check text-slate-800 text-xs"></i>
                {% else %}
                    1
                {% endif %}
            </div>
            <span class="absolute mt-12 text-xs font-medium tracking-tight {% if active_step == 1 %}text-slate-900 font-semibold{% else %}text-slate-400{% endif %}">Confirm</span>
        </div>

        <div class="flex flex-col items-center">
            <div class="w-10 h-10 rounded-full flex items-center justify-center border-2 font-semibold text-sm transition-all duration-300 
                {% if active_step >= 2 %}
                    border-slate-800 bg-white text-slate-900 shadow-sm ring-4 ring-slate-900/5
                {% else %}
                    border-slate-200 bg-white text-slate-400
                {% endif %}">
                {% if active_step > 2 %}
                    <i class="fa-solid fa-check text-slate-800 text-xs"></i>
                {% else %}
                    2
                {% endif %}
            </div>
            <span class="absolute mt-12 text-xs font-medium tracking-tight {% if active_step == 2 %}text-slate-900 font-semibold{% else %}text-slate-400{% endif %}">Delivery</span>
        </div>

        <div class="flex flex-col items-center">
            <div class="w-10 h-10 rounded-full flex items-center justify-center border-2 font-semibold text-sm transition-all duration-300 
                {% if active_step == 3 %}
                    border-slate-800 bg-white text-slate-900 shadow-sm ring-4 ring-slate-900/5
                {% else %}
                    border-slate-200 bg-white text-slate-400
                {% endif %}">
                3
            </div>
            <span class="absolute mt-12 text-xs font-medium tracking-tight {% if active_step == 3 %}text-slate-900 font-semibold{% else %}text-slate-400{% endif %}">Payment</span>
        </div>
    </div>
</div>
