{% extends "base.html" %}

{% block content %}

<h2>My Orders</h2>
<hr>

<table class="table table-bordered">

    <tr>
        <th>Order #</th>
        <th>Status</th>
        <th>Payment</th>
        <th>Total</th>
        <th>Date</th>
        <th>Action</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order.order_number }}</td>
        <td>{{ order.status }}</td>
        <td>{{ order.payment_status }}</td>
        <td>${{ order.total_amount }}</td>
        <td>{{ order.created_at }}</td>
        <td>
            <a href="{% url 'order-detail' order.id %}" class="btn btn-primary btn-sm">
                View
            </a>
        </td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
