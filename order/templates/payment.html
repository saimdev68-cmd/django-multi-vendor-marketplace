{% extends "base.html" %}

{% block title %}Secure Payment{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
    
    {% include "partials/_checkout_steps.html" with active_step=active_step %}

    <div class="max-w-xl mx-auto mt-16">
        <div class="bg-white border border-slate-100 rounded-2xl p-8 shadow-sm">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-1">Payment Method</h1>
                    <p class="text-sm text-slate-500">Secure 256-bit encrypted checkout portal.</p>
                </div>
                <i class="fa-solid fa-shield-halved text-slate-400 text-2xl"></i>
            </div>
            
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Cardholder Name</label>
                    <input type="text" name="card_holder_name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 focus:border-slate-800 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Card Number</label>
                    <div class="relative">
                        <input type="text" name="card_number" placeholder="•••• •••• •••• ••••" required class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 focus:border-slate-800 transition-all">
                        <i class="fa-regular fa-credit-card absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Expiration Date</label>
                        <input type="text" placeholder="MM/YY" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 focus:border-slate-800 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">CVV Security Code</label>
                        <input type="text" name="cvv" placeholder="•••" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 focus:border-slate-800 transition-all">
                    </div>
                </div>

                <div class="pt-4 flex gap-4">
                    <a href="{% url 'order:delivery' %}" class="w-1/2 py-3.5 px-4 border border-slate-200 rounded-xl text-center text-sm font-medium text-slate-600 hover:bg-slate-50 transition-all">
                        Back to Delivery
                    </a>
                    <button type="submit" class="w-1/2 py-3.5 px-4 rounded-xl text-sm font-medium text-white bg-gradient-to-b from-slate-700 to-slate-900 hover:from-slate-800 hover:to-black transition-all shadow-sm">
                        <i class="fa-solid fa-lock mr-2 text-xs"></i> Authorize Payment
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
