{% extends "base.html" %}

{% block title %}Delivery Details{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
    
    {% include "partials/_checkout_steps.html" with active_step=active_step %}

    <div class="max-w-xl mx-auto mt-16">
        <div class="bg-white border border-slate-100 rounded-2xl p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Shipping Information</h1>
            <p class="text-sm text-slate-500 mb-6">Please input your matching delivery coordinates below.</p>
            
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Full Name</label>
                    <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 focus:border-slate-800 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Phone Number</label>
                    <input type="text" name="phone_number" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 focus:border-slate-800 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Full Delivery Address</label>
                    <textarea name="address" rows="4" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-4 focus:ring-slate-900/5 focus:border-slate-800 transition-all"></textarea>
                </div>

                <div class="pt-2 flex gap-4">
                    <a href="{% url 'order:confirm' %}" class="w-1/2 py-3 px-4 border border-slate-200 rounded-xl text-center text-sm font-medium text-slate-600 hover:bg-slate-50 transition-all">
                        Back
                    </a>
                    <button type="submit" class="w-1/2 py-3 px-4 rounded-xl text-sm font-medium text-white bg-gradient-to-b from-slate-700 to-slate-900 hover:from-slate-800 hover:to-black transition-all shadow-sm">
                        Continue to Payment
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
