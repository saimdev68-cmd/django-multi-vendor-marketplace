{% extends "base.html" %}

{% block title %}Order | Confirm{% endblock  %}

{% block content %}
{% for item in items %}
<p>{{item.product.name}}</p>
<img src="{{item.product.image.url}}" width="200" height="100" alt="">
<p>{{item.product.price}}</p>
<p>Quantity : {{item.quantity}}</p>
{% endfor %}
{% endblock  %}
