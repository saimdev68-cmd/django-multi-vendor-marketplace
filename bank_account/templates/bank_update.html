{% extends "base_vendor.html" %}

{% block title %} Bank Account | Configure {% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-header-title">Configure Settlement Bank Account</h2>
    
    <form action="" method="post">
        {% csrf_token %}
        
        {# Spans full-width; internal fields map to our structural layouts automatically #}
        {{ form.as_p }}
        
        <div class="form-actions-group">
            <button type="submit" class="btn-primary-submit">Save Settings</button>
            <a href="{% url 'bank:detail' %}" class="btn-link-cancel">Cancel and Exit</a>
        </div>
    </form>
</div>
{% endblock %}
