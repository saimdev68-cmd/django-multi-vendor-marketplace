{% extends "base.html" %}

{% block title %}Delete Product{% endblock %}

{% block content %}

<h3>Are you sure you want to delete "{{ object.name }}"?</h3>

<form method="post">
    {% csrf_token %}
    
    <button class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'vendor-product-list' %}" class="btn btn-secondary">Cancel</a>

</form>

{% endblock %}
