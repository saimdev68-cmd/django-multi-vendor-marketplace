{% extends "base_vendor.html" %}

{% block title %}Product{% endblock  %}

{% block content %}
{% for product in products %}
<a href="{% url "products:product_detail" product.id %}"><p>{{product.name}}</p></a>
<p>{{product.status}}</p>
<p>${{product.price}}</p>
{% if product.image %}
<img src="{{product.image.url}}" width="800" height="400" alt="">
{% endif %}
<a href="{% url "products:product_update" product.id %}">Edit</a>
<form action="{% url "products:product_delete" product.id %}" method="post">
    {% csrf_token %}
    <button type="submit" onclick="return confirm ('Are You Sure ?')">
        Delete
    </button>
</form>
{% endfor %}
{% endblock  %}
