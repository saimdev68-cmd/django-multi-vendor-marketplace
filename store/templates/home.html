{% extends "base.html" %}

{% block title %}Home{% endblock  %}


{% block content %}
<h1>Categories</h1>
<a href="{% url "store:category_list" %}">View All</a>
{% for category in categories %}
<p>{{category.name}}</p>
<img src="{{category.image.url}}" width="150" height="80" alt=""><br>
{% endfor %}
{% for product in products %}
<img src="{{product.image.url}}" width="600" height="200" alt="">
<a href="{% url "products:product_detail" product.id %}"><p>{{product.name}}</p></a>
{% endfor %}
{% endblock %}
